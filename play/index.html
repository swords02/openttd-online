<!-- Jazz Jukebox script, wrapped in DOMContentLoaded -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const playlist = [
    { title: "tttheme2", src: "music/tttheme2.mp3" },
    { title: "5432gone_redfarn", src: "music/5432gone_redfarn.mp3" },
    { title: "be_sharp_bw_redfarn", src: "music/be_sharp_bw_redfarn.mp3" },
    { title: "big_man_boogie_redfarn", src: "music/big_man_boogie_redfarn.mp3" },
    { title: "boogi_marabi_redfarn", src: "music/boogi_marabi_redfarn.mp3" },
    { title: "busy_schedule", src: "music/busy_schedule.mp3" },
    { title: "careless_perc_redfarn", src: "music/careless_perc_redfarn.mp3" },
    { title: "chemistry_lab", src: "music/chemistry_lab.mp3" },
    { title: "chuggachugga", src: "music/chuggachugga.mp3" },
    { title: "city_blues_redfarn", src: "music/city_blues_redfarn.mp3" },
    { title: "coconut_run2", src: "music/coconut_run2.mp3" },
    { title: "flying_scotsman", src: "music/flying_scotsman.mp3" },
    { title: "harp_harmony", src: "music/harp_harmony.mp3" },
    { title: "linns_basket", src: "music/linns_basket.mp3" },
    { title: "midnight_snow_run", src: "music/midnight_snow_run.mp3" },
    { title: "mighty_giant_run", src: "music/mighty_giant_run.mp3" },
    { title: "modern_motion", src: "music/modern_motion.mp3" },
    { title: "moo_redfarn", src: "music/moo_redfarn.mp3" },
    { title: "mosey_along_redfarn", src: "music/mosey_along_redfarn.mp3" },
    { title: "no_work_song_redfarn", src: "music/no_work_song_redfarn.mp3" },
    { title: "relax_song", src: "music/relax_song.mp3" },
    { title: "run_for_your_life", src: "music/run_for_your_life.mp3" },
    { title: "say_what_redfarn", src: "music/say_what_redfarn.mp3" },
    { title: "slow_neasy_redfarn", src: "music/slow_neasy_redfarn.mp3" },
    { title: "the_fast_route", src: "music/the_fast_route.mp3" },
    { title: "the_hobo_redfarn", src: "music/the_hobo_redfarn.mp3" },
    { title: "train_filled_with_cash", src: "music/train_filled_with_cash.mp3" },
    { title: "ttsong_iii_imuh3", src: "music/ttsong_iii_imuh3.mp3" },
    { title: "ttsong_iv_imuh3", src: "music/ttsong_iv_imuh3.mp3" },
    { title: "ultimate_run", src: "music/ultimate_run.mp3" },
    { title: "wood_whistles", src: "music/wood_whistles.mp3" }
  ];

  const audio = document.getElementById("audioElement");
  const ttdWindow = document.getElementById("ttdWindow");
  const openMusicBtn = document.getElementById("openMusicBtn");

  const playlistList = document.getElementById("playlistList");
  const playlistCountLabel = document.getElementById("playlistCountLabel");
  const playlistModeLabel = document.getElementById("playlistModeLabel");

  const btnPlayPause = document.getElementById("btnPlayPause");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnShuffle = document.getElementById("btnShuffle");
  const btnRepeat = document.getElementById("btnRepeat");

  const currentTrackTitle = document.getElementById("currentTrackTitle");
  const progressBarWrap = document.getElementById("progressBarWrap");
  const progressBarFill = document.getElementById("progressBarFill");
  const currentTimeLabel = document.getElementById("currentTimeLabel");
  const durationLabel = document.getElementById("durationLabel");
  const volumeSlider = document.getElementById("volumeSlider");

  let currentIndex = 0;
  let isShuffle = false;
  let isRepeat = false;

  /* First-click autoplay helper (browser gesture requirement) */
  let firstPlayArmed = true;
  document.addEventListener("click", function onFirstClick() {
    if (!firstPlayArmed) return;
    firstPlayArmed = false;
    audio.play().catch(()=>{});
    document.removeEventListener("click", onFirstClick, true);
  }, { capture: true });

  /* Load track */
  function loadTrack(index, autoplay = false) {
    currentIndex = index;
    const track = playlist[index];
    audio.src = track.src;
    currentTrackTitle.textContent = track.title;
    highlightActive();
    if (autoplay) audio.play().catch(()=>{});
  }

  function highlightActive() {
    document.querySelectorAll(".playlist-item").forEach(el => {
      el.classList.toggle("active", parseInt(el.dataset.index) === currentIndex);
    });
  }

  /* Build playlist */
  function buildPlaylist() {
    playlistList.innerHTML = "";
    playlist.forEach((track, i) => {
      const item = document.createElement("div");
      item.className = "playlist-item";
      item.textContent = track.title;
      item.dataset.index = i;
      item.onclick = () => loadTrack(i, true);
      playlistList.appendChild(item);
    });
    playlistCountLabel.textContent = playlist.length + " tracks";
  }

  /* Next / Prev */
  function nextTrack(auto=false) {
    if (isRepeat && auto) {
      loadTrack(currentIndex, true);
      return;
    }
    if (isShuffle) {
      let r;
      do r = Math.floor(Math.random()*playlist.length);
      while (r===currentIndex);
      loadTrack(r, true);
    } else {
      currentIndex = (currentIndex+1)%playlist.length;
      loadTrack(currentIndex, true);
    }
  }

  function prevTrack() {
    if (isShuffle) {
      let r;
      do r = Math.floor(Math.random()*playlist.length);
      while (r===currentIndex);
      loadTrack(r,true);
    } else {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex, true);
    }
  }

  /* Wire up next / previous buttons (mouse + touch) */
  function bindTransportButton(btn, handler) {
    if (!btn) return;

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      handler();
    });

    btn.addEventListener("touchend", (e) => {
      e.preventDefault();
      handler();
    }, { passive: false });
  }

  bindTransportButton(btnNext, () => nextTrack(false));
  bindTransportButton(btnPrev, prevTrack);

  /* Play/pause button (with dynamic icon) */
  function updatePlayPauseIcon() {
    if (!audio) return;
    btnPlayPause.innerHTML = audio.paused ? "&#9658;" : "&#10074;&#10074;";
  }

  btnPlayPause.onclick = () => {
    if (audio.paused) {
      audio.play().catch(()=>{});
    } else {
      audio.pause();
    }
  };

  audio.addEventListener("play", updatePlayPauseIcon);
  audio.addEventListener("pause", updatePlayPauseIcon);

  /* Shuffle / Repeat */
  btnShuffle.onclick = () => {
    isShuffle = !isShuffle;
    btnShuffle.classList.toggle("toggle-on", isShuffle);
  };

  btnRepeat.onclick = () => {
    isRepeat = !isRepeat;
    btnRepeat.classList.toggle("toggle-on", isRepeat);
  };

  /* Volume */
  volumeSlider.oninput = () => audio.volume = volumeSlider.value;

  /* Seek */
  progressBarWrap.onclick = (e) => {
    const rect = progressBarWrap.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if (!isNaN(audio.duration)) {
      audio.currentTime = ratio * audio.duration;
    }
  };

  /* Time update */
  audio.ontimeupdate = () => {
    currentTimeLabel.textContent = formatTime(audio.currentTime);
    durationLabel.textContent = formatTime(audio.duration);
    if (!isNaN(audio.duration) && audio.duration > 0) {
      progressBarFill.style.width =
        (audio.currentTime / audio.duration) * 100 + "%";
    } else {
      progressBarFill.style.width = "0%";
    }
  };

  audio.onended = () => nextTrack(true);

  function formatTime(s) {
    if (isNaN(s)) return "0:00";
    let m = Math.floor(s/60);
    let sec = Math.floor(s%60).toString().padStart(2,"0");
    return m+":"+sec;
  }

  /* Window drag */
  const header = document.getElementById("ttdWindowHeader");
  let drag = false, dx = 0, dy = 0;

  header.onmousedown = (e) => {
    drag = true;
    dx = e.clientX - ttdWindow.offsetLeft;
    dy = e.clientY - ttdWindow.offsetTop;
  };
  document.onmouseup = () => drag = false;
  document.onmousemove = (e) => {
    if (!drag) return;
    ttdWindow.style.left = (e.clientX - dx) + "px";
    ttdWindow.style.top = (e.clientY - dy) + "px";
  };

  /* Open / Close */
  openMusicBtn.onclick = () => {
    ttdWindow.style.display = "flex";
    audio.play().catch(()=>{});
  };

  document.getElementById("btnClose").onclick = () =>
    ttdWindow.style.display="none";

  /* Init */
  buildPlaylist();
  loadTrack(0, false);
  audio.volume = 0.6;
  updatePlayPauseIcon();
});
</script>

    function mkdirp(path){
      const parts = path.replace(/\/+$/,'').split('/').filter(Boolean);
      let cur=''; for(const p of parts){ cur+='/'+p; try{ FS.mkdir(cur); }catch(_){ } }
    }
    function exists(path){
      try{ FS.stat(path); return true; }catch(_){ return false; }
    }
    function readdirSafe(dir){
      try { return FS.readdir(dir).filter(f=>f!=='.'&&f!=='..'); } catch(_) { return []; }
    }
    function copyFile(src, dst){
      const data = FS.readFile(src);
      mkdirp(dst.substring(0, dst.lastIndexOf('/')));
      FS.writeFile(dst, data);
    }
    function copyTree(srcDir, dstDir){
      mkdirp(dstDir);
      for(const name of readdirSafe(srcDir)){
        const s = srcDir + '/' + name;
        const d = dstDir + '/' + name;
        const st = FS.stat(s);
        if (st.mode && (st.mode & 0x4000)) {
          copyTree(s, d);
        } else {
          copyFile(s, d);
        }
      }
    }

    function ensureIDBMounted() {
      return new Promise((resolve, reject) => {
        try {

          const prev = (() => { try { return localStorage.getItem(BUILD_KEY); } catch(_) { return null; } })();
          const changed = prev && prev !== BUILD_ID;

          if (changed) {
            try {
              indexedDB.databases?.().then(dbs => dbs.forEach(db => indexedDB.deleteDatabase(db.name)));
            } catch(_) {}
            try { localStorage.setItem(BUILD_KEY, BUILD_ID); } catch(_) {}
          }
          if (!prev) { try { localStorage.setItem(BUILD_KEY, BUILD_ID); } catch(_) {} }

          if (__idbReady) return resolve();
          mkdirp(IDB_ROOT);
          let mounted = false;
          try { mounted = !!FS.lookupPath(IDB_ROOT).node.mounted; } catch(_) {}
          if (!mounted) {
            FS.mount(IDBFS, {}, IDB_ROOT);
          }
          FS.syncfs(true, (err) => {
            if (err) { console.error('IDBFS initial sync failed', err); reject(err); return; }
            __idbReady = true;
            if (exists(IDB_MIRROR)) {
              mkdirp(LIVE_ROOT);
              copyTree(IDB_MIRROR, LIVE_ROOT);
            }
            resolve();
          });
        } catch (e) {
          console.error('IDBFS mount error', e);
          reject(e);
        }
      });
    }

    function newestByMtime(dir, exts){
      try{
        const items = FS.readdir(dir)
          .filter(f=>f!=='.'&&f!=='..')
          .filter(f=>{
            const low=f.toLowerCase();
            return (Array.isArray(exts)? exts : [exts]).some(ext=>low.endsWith(ext));
          });
        if(!items.length) return null;
        let best = items[0], t = 0;
        for(const f of items){ const st=FS.stat(dir+f); if(st && st.mtime>t){ best=f; t=st.mtime; } }
        return best;
      }catch(_){ return null; }
    }

          if ((Array.isArray(exts) ? exts : [exts]).some(ext => low.endsWith(ext))) out.push(f);

    function __loadScriptOnce(src){
      return new Promise((resolve, reject) => {
        const existing = Array.from(document.getElementsByTagName('script')).find(s => s.src === src);
        if (existing && existing.dataset.loaded === '1') return resolve();
        if (existing && existing.dataset.loading === '1') {
          existing.addEventListener('load', () => resolve(), { once: true });
          existing.addEventListener('error', () => reject(new Error('Failed to load ' + src)), { once: true });
          return;
        }
        const s = existing || document.createElement('script');
        if (!existing) {
          s.src = src;
          s.async = true;
          document.head.appendChild(s);
        }
        s.dataset.loading = '1';
        s.addEventListener('load', () => { s.dataset.loaded = '1'; resolve(); }, { once: true });
        s.addEventListener('error', () => reject(new Error('Failed to load ' + src)), { once: true });
      });
    }

    function __ensureDriveInit(){
      if (__driveInitPromise) return __driveInitPromise;

      __driveInitPromise = (async () => {
        await __loadScriptOnce('https://accounts.google.com/gsi/client');
        await __loadScriptOnce('https://apis.google.com/js/api.js');

        __tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: DRIVE_CLIENT_ID,

        await new Promise((resolve) => {

        return true;

    function __getAccessToken({ prompt } = { prompt: '' }){
      return new Promise(async (resolve, reject) => {
        try{
          await __ensureDriveInit();

          const now = Date.now();
          if (__accessToken && now < (__tokenExpiryMs - 30_000)) {
            resolve(__accessToken);
            return;
          }

          __tokenClient.callback = (resp) => {
            if (resp && resp.access_token) {
              __accessToken = resp.access_token;
              const expiresIn = Number(resp.expires_in || 3600);
              __tokenExpiryMs = Date.now() + expiresIn * 1000;
              resolve(__accessToken);
            } else {
              reject(new Error(resp && resp.error ? resp.error : 'No access token returned'));
            }
          };

          __tokenClient.requestAccessToken({ prompt: prompt ?? '' });
        }catch(e){ reject(e); }
      });
    }

    async function __driveDownloadBytes(fileId){
      const token = await __getAccessToken({ prompt: '' });
      const url = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(fileId) + '?alt=media';
      const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) {
        const txt = await res.text().catch(()=> '');
        throw new Error('Drive download failed (' + res.status + '): ' + (txt || res.statusText));
      }
      return new Uint8Array(await res.arrayBuffer());
    }

    async function __driveUploadBytes({ name, bytes, mimeType, parentId }){
      const token = await __getAccessToken({ prompt: '' });

      const metadata = { name: name || 'file.bin' };
      if (parentId) metadata.parents = [parentId];

      const boundary = '-------openttdonline' + Math.random().toString(16).slice(2);
      const delimiter = '\r\n--' + boundary + '\r\n';
      const closeDelim = '\r\n--' + boundary + '--';

      const metaPart =
        delimiter +
        'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
        JSON.stringify(metadata);

      const filePartHeader =
        delimiter +
        'Content-Type: ' + (mimeType || 'application/octet-stream') + '\r\n\r\n';

      const body = new Blob([metaPart, filePartHeader, bytes, closeDelim], {
        type: 'multipart/related; boundary=' + boundary
      });

      const uploadUrl = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
      const res = await fetch(uploadUrl, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body
      });

      if (!res.ok) {
        const txt = await res.text().catch(()=> '');
        throw new Error('Drive upload failed (' + res.status + '): ' + (txt || res.statusText));
      }
      return await res.json().catch(()=> ({}));
    }

      const low = (name || '').toLowerCase();
      return (Array.isArray(exts) ? exts : [exts]).some(ext => low.endsWith(ext));
    }

          });
          if (!chosen) return;
        }

        const folder = await __pickFolder();
        if (!folder) return;

        const data = FS.readFile(SCEN_DIR + chosen);
        await __driveUploadBytes({
          name: chosen,
          bytes: data,
          mimeType: 'application/octet-stream',
          parentId: folder.id
        });

        alert('Uploaded to Google Drive:\n' + chosen + '\n\nFolder: ' + folder.name);
      }catch(e){
        console.error(e);
        alert('Google Drive export failed: ' + (e && e.message ? e.message : e));
      }
    }

    async function importScenarioFromDrive(){
      try{
        const picked = await __pickSingleFile();
        if (!picked) return;
        if (!__ensureExt(picked.name, ['.scn'])) {
          alert('That file does not look like an OpenTTD scenario (.scn):\n' + picked.name);
          return;
        }

        const bytes = await __driveDownloadBytes(picked.id);

        await ensureIDBMounted();
        mkdirp(SCEN_DIR); mkdirp(IDB_MIRROR + '/scenario/');
        FS.writeFile(SCEN_DIR + picked.name, bytes);
        FS.writeFile(IDB_MIRROR + '/scenario/' + picked.name, bytes);
        await new Promise((res,rej)=>FS.syncfs(false,(err)=>err?rej(err):res()));

        alert('Imported from Google Drive & saved to browser storage:\n' + SCEN_DIR + picked.name);
      }catch(e){
        console.error(e);
        alert('Google Drive import failed: ' + (e && e.message ? e.message : e));
      }
    }

    // ----- Heightmap (.png/.bmp) -----
    async function exportHeightmapToDrive(){
      try{
        const files = listFilesWithExts(HEIGHT_DIR, ['.png','.bmp']);
        if(!files.length){ alert('No heightmap (.png or .bmp) found in ' + HEIGHT_DIR); return; }

        let chosen = files[0];
        if (files.length > 1) {
          chosen = await showFilePicker({
            title: 'Export Heightmap to Google Drive',
            hint: 'Choose which heightmap to export from /scenario/heightmap/',
            files
          });
          if (!chosen) return;
        }

        const folder = await __pickFolder();
        if (!folder) return;

        const data = FS.readFile(HEIGHT_DIR + chosen);
        const type = chosen.toLowerCase().endsWith('.png') ? 'image/png'
                   : chosen.toLowerCase().endsWith('.bmp') ? 'image/bmp'
                   : 'application/octet-stream';

        await __driveUploadBytes({
          name: chosen,
          bytes: data,
          mimeType: type,
          parentId: folder.id
        });

        alert('Uploaded to Google Drive:\n' + chosen + '\n\nFolder: ' + folder.name);
      }catch(e){
        console.error(e);
        alert('Google Drive export failed: ' + (e && e.message ? e.message : e));
      }
    }

    async function importHeightmapFromDrive(){
      try{
        const picked = await __pickSingleFile();
        if (!picked) return;
        if (!__ensureExt(picked.name, ['.png','.bmp'])) {
          alert('That file does not look like a heightmap (.png or .bmp):\n' + picked.name);
          return;
        }

        const bytes = await __driveDownloadBytes(picked.id);

        await ensureIDBMounted();
        mkdirp(HEIGHT_DIR); mkdirp(IDB_MIRROR + '/scenario/heightmap/');
        FS.writeFile(HEIGHT_DIR + picked.name, bytes);
        FS.writeFile(IDB_MIRROR + '/scenario/heightmap/' + picked.name, bytes);
        await new Promise((res,rej)=>FS.syncfs(false,(err)=>err?rej(err):res()));

        alert('Imported heightmap from Google Drive & saved to browser storage:\n' + HEIGHT_DIR + picked.name + '\n\nLoad via Scenario Editor → Heightmap.');
      }catch(e){
        console.error(e);
        alert('Google Drive import failed: ' + (e && e.message ? e.message : e));
      }
    }
  </script>

  <script src="openttd.js?v=15.2-2"></script>

  <script>
  (function(){
  const SENSITIVITY = 0.2;

  function attach(){
    const canvas = (window.Module && Module.canvas) || document.getElementById('canvas');
    if (!canvas) return false;

    canvas.style.touchAction = 'none';
    canvas.style.cursor = 'none';

    let pA = null, pB = null;
    let lastDist = 0;

    function pinchDist(t1, t2){
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 2){
        e.preventDefault();
        pA = e.touches[0];
        pB = e.touches[1];
        lastDist = pinchDist(pA, pB);
      }
    }, {passive:false});

    canvas.addEventListener('touchmove', e => {
      if (e.touches.length !== 2) return;
      e.preventDefault();

      const t1 = e.touches[0], t2 = e.touches[1];
      const dist = pinchDist(t1, t2);
      const scale = dist / lastDist;

      if (Math.abs(scale - 1) > 0.01) {
        const cx = (t1.clientX + t2.clientX) / 2;
        const cy = (t1.clientY + t2.clientY) / 2;

        const delta = (Math.log(scale) / Math.log(1.05)) * 120 * SENSITIVITY;
        canvas.dispatchEvent(new WheelEvent('wheel', {
          deltaY: -delta,
          clientX: cx,
          clientY: cy,
          bubbles: true
        }));
        lastDist = dist;
      }
    }, {passive:false});

    canvas.addEventListener('touchend', e => {
      if (e.touches.length < 2) pA = pB = null;
    }, {passive:false});

    canvas.addEventListener('touchcancel', () => { pA = pB = null; }, {passive:false});

    return true;
  }

  if (!attach()){
    const prev = (window.Module && Module.onRuntimeInitialized) || null;
    window.Module = window.Module || {};
    Module.onRuntimeInitialized = function(){
      if (prev) prev();
      attach();
    };
    window.addEventListener('load', () => setTimeout(attach, 0));
    }
  })();
  </script>
